name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'gen3d-inspector/**'
      - 'early-projects/plants-vs-zombies/**'
      - '.github/workflows/deploy-gen3d-inspector.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gen3d-inspector
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gen3d-inspector/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build static GitHub Pages bundle
        run: npm run build:github-pages
      - name: Verify generated bundle
        run: npm run verify:github-pages
      - name: Assemble Portfolio Pages site
        run: |
          rm -rf pages-output
          mkdir -p pages-output/apps/gen3d-inspector
          mkdir -p pages-output/games/plants-vs-zombies
          touch pages-output/.nojekyll
          cp ../portfolio-home/index.html pages-output/index.html
          cp -R dist-static/. pages-output/apps/gen3d-inspector/
          cp -R ../early-projects/plants-vs-zombies/. pages-output/games/plants-vs-zombies/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: gen3d-inspector/pages-output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
